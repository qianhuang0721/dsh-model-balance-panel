# dsh-model-balance-panel 的 bundle patch —— 把余额面板挂进 DSH 配置树。
#
# insert 往配置树里加一行 entry：
#   id   行标识（patch 覆盖时按它定位），必须与包名一致 —— 插件市场按它比对 entryIds
#   name 模块名，解析到包入口 index.js（宿主半侧）
#
# package.json 声明了 dsh.client，DSH 的模块系统会同时把本包扫描为浏览器插件，
# 提供到页面的 client.js。
#
# 注意：插件行那一行（"id: 值"）不要写行尾注释，市场预检按整行取 entry id。
- insert:
    - id: dsh-model-balance-panel
      name: 'dsh-model-balance-panel'
